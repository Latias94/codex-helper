[package]
name = "codex-helper-desktop"
version = "0.20.4"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
description = "Tauri desktop client for codex-helper."

[package.metadata.dist]
dist = false

[lib]
name = "codex_helper_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
codex-helper-core = { path = "../../../crates/core", version = "0.20.4" }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-opener = "2.7.1"
tauri-plugin-single-instance = "2.5.3"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["time"] }
toml = "1.1.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.7.0"
