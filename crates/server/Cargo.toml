[package]
name = "codex-helper-server"
version = "0.20.4"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Container-oriented server runtime for codex-helper central relay deployments."
repository = "https://github.com/Latias94/codex-helper"

[[bin]]
name = "codex-helper-server"
path = "src/main.rs"

[dependencies]
codex-helper-core = { path = "../core", version = "0.20.4" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
