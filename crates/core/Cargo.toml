[package]
name = "codex-helper-core"
version = "0.20.4"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Core library for codex-helper."
repository = "https://github.com/Latias94/codex-helper"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
toml_edit = "0.25.17"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "fs", "time"] }
axum = { version = "0.8.9", features = ["http2", "macros", "ws"] }
hyper = { version = "1.12.0", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.13.5", features = ["json", "stream", "gzip", "brotli", "zstd", "deflate"] }
brotli = "9.0.0"
chrono = "0.4.45"
flate2 = "1.1.10"
zstd = "0.14.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.21"
dirs = "7.0.0"
uuid = { version = "1.28.0", features = ["v4"] }
rand = "0.10.3"
futures-util = "0.3.34"
regex = "1.13.1"
owo-colors = "4.4.0"
humantime = "2.4.0"
httpdate = "1.0.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sysinfo = "0.39.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
tower = { version = "0.5.3", features = ["util"] }
